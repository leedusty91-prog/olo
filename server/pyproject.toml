[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "olo"
version = "0.0.1"
description = "olo: AI companion backend (FastAPI + PostgreSQL + optional VoiceMem memory)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "python-multipart==0.0.20",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# 真实长期记忆（API 版，无 torch）：装完这个 extra 后再执行
#   pip install --no-deps voicemem==0.2.3
# voicemem 的 PyPI 元数据把 torch/funasr 等本地模型依赖列为必需，但文本模式 + API
# embedding 的代码路径只用到下面这些（见 olo/memory/voicemem_api.py）。
memory-api = [
    "mem0ai==2.2.1",
    "numpy==2.5.4",
    "openai==3.36.1",
]
# 完整版（含本地 ASR / 声纹 / 情绪模型，需要 torch，体积数 GB）
memory = [
    "voicemem==0.2.3",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["olo", "safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not manual'"
markers = ["manual: not part of default CI"]
