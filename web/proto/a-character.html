<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="lib/ui.css"><title>olo proto a · character</title><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head>
<body><canvas></canvas><div class="hud"></div>
<script type="module">
import { makeWorld, makeOlo, FORMS } from './lib/three-scene.js';
const W=makeWorld(document.querySelector('canvas')); window.__m=W; const port=innerWidth<innerHeight;
W.camera.position.set(0,port?2.3:1.5,port?8:6.5); W.camera.lookAt(0,port?2.1:.9,0);
const olos=FORMS.map((f,i)=>{const o=makeOlo(f,i); const c=port?i%2:i%5, r=port?Math.floor(i/2):Math.floor(i/5);
  o.position.set(port?(c-.5)*1.4:(c-2)*1.3, port?4.0-r*.95:1.5-r*1.1, 0); o.scale.setScalar(port?.75:.85); W.scene.add(o); return o;});
const hud=document.querySelector('.hud');
W.loop(t=>{olos.forEach((o,i)=>{o.userData.tick(t); o.rotation.y=.3*Math.sin(t*.5+i);}); hud.textContent=`${W.fps().toFixed(0)} fps · 10 forms · Three`;});
</script></body></html>
