<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="lib/ui.css"><title>olo proto a · home</title><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head>
<body><canvas></canvas><div class="hud"></div><div class="forms"></div><div class="bar"><input placeholder="对镜子说点什么…"><button>发送</button></div>
<script type="module">
import { makeWorld, makeOlo, FORMS } from './lib/three-scene.js';
const q=new URLSearchParams(location.search), W=makeWorld(document.querySelector('canvas')); window.__m=W;
let f=FORMS.find(x=>x.id===q.get('form'))||FORMS[0]; const olo=makeOlo(f); olo.position.set(0,.75,0); W.scene.add(olo);
const fs=document.querySelector('.forms'); FORMS.forEach(x=>{const b=document.createElement('b');b.style.background=`linear-gradient(${x.a},${x.b})`;b.onclick=()=>olo.userData.setForm(x);fs.appendChild(b);});
let mood=0; const inp=document.querySelector('input'), hud=document.querySelector('.hud'); let last=0;
inp.addEventListener('input',()=>{const t=W.now(); if(t-last>.12){W.ripple((Math.random()-.5)*2.4,-(1.2+Math.random()*1.4),.5); last=t;}});
const send=()=>{const v=inp.value.trim(); if(!v)return; inp.value=''; W.ripple(0,-2.6,1.2);
  const b=document.createElement('div'); b.className='bubble'; b.textContent=v; b.style.bottom='90px'; document.body.appendChild(b);
  requestAnimationFrame(()=>{b.style.transform='translate(-50%,-38vh) scale(.6)'; b.style.opacity='0';});
  setTimeout(()=>{b.remove(); mood=1; W.ripple(0,0,1); setTimeout(()=>mood=0,900);},2200);};
document.querySelector('button').onclick=send; inp.addEventListener('keydown',e=>e.key==='Enter'&&send());
const gpu='gpu' in navigator?'WebGPU可用':'无WebGPU';
W.loop(t=>{ olo.position.y=.75+.05*Math.sin(t*1.3); olo.rotation.y=.25*Math.sin(t*.4); olo.userData.tick(t,mood);
  hud.textContent=`${W.fps().toFixed(0)} fps · Three r170 WebGL2 · ${gpu}`;});
if(q.get('demo')){const txt='今天好累啊';let i=0;const tick=()=>{if(i<=txt.length){inp.value=txt.slice(0,i++);inp.dispatchEvent(new Event('input'));setTimeout(tick,260);}else setTimeout(send,400);};setTimeout(tick,800);}
</script></body></html>
