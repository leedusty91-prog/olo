services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-olo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olo} -d ${POSTGRES_DB:-olo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        OLO_VOICEMEM: ${OLO_VOICEMEM:-1}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-olo}:${POSTGRES_PASSWORD:-olo_dev_password}@postgres:5432/${POSTGRES_DB:-olo}
      OLO_API_TOKEN: ${OLO_API_TOKEN:-change-me-dev-token}
      # 没有填 OPENAI_API_KEY 时默认走离线 mock，保证 clone 下来就能跑
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # 长期记忆：auto = 有 OPENAI_API_KEY 就用 VoiceMem（API 模式），否则 FakeMemory
      OLO_MEMORY: ${OLO_MEMORY:-auto}
      OLO_VOICEMEM_DIR: /app/data/voicemem
      MEM0_DIR: /app/data/voicemem/mem0
      OLO_SEED_DEMO: ${OLO_SEED_DEMO:-1}
      # 默认关闭。=1 时 /app 页面会把共享的 OLO_API_TOKEN 写进网页，任何能打开 /app 的人都拿到完整 API 权限；
      # 只在本机演示时临时打开（OLO_WEB_EMBED_TOKEN=1 docker compose up），绝不要在公网 / 局域网共享时开启
      OLO_WEB_EMBED_TOKEN: ${OLO_WEB_EMBED_TOKEN:-0}
      # 没有收据校验：=1 才允许 /v1/subscription/activate 直接开通 olo+（仅开发）
      OLO_DEV_SUBSCRIPTIONS: ${OLO_DEV_SUBSCRIPTIONS:-0}
      # 后台任务的思考模式保持关闭（省钱、可预期）
      OLO_AUX_THINKING: ${OLO_AUX_THINKING:-disabled}
      # 日记默认开思考（更走心）
      OLO_DIARY_THINKING: ${OLO_DIARY_THINKING:-enabled}
      # 本地调试：商店里出现「+100 代币」按钮。生产环境保持 0
      OLO_DEBUG: ${OLO_DEBUG:-0}
    volumes:
      - appdata:/app/data
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
  appdata:
